{{define "content"}}<h1>Настройки сервиса</h1><p>Пустое значение возвращает настройку из окружения. Изменения применяются после сохранения.</p><form method="post" class="card stack"><input type="hidden" name="csrf" value="{{.CSRF}}">{{range .Data}}<label>{{.Key}}<input name="{{.Key}}" value="{{.Value}}" autocomplete="off"></label>{{end}}<button class="btn btn-primary">Сохранить настройки</button></form>{{end}}
