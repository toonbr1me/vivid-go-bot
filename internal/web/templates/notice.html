{{define "content"}}
<article class="card result-card">
  <h1>{{.Data.Title}}</h1>
  <p class="lead">{{.Data.Text}}</p>
  <div class="hero-actions">
    <a class="btn btn-primary" href="/">На главную</a>
    {{if .Subject}}<a class="btn btn-ghost" href="/account">В кабинет</a>
    {{else}}<a class="btn btn-ghost" href="/support">Поддержка</a>{{end}}
  </div>
</article>
{{end}}
