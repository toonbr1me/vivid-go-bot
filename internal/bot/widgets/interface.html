<!doctype html><html><head><style>
body{padding:0;margin:16px;color:var(--tg-theme-text-color);font-family:system-ui}button{font:inherit;border:0;border-radius:8px;min-height:40px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color);transition:background-color .16s ease}button:active{background:var(--tg-theme-bg-color)}button:disabled{color:var(--tg-theme-hint-color)}header{display:flex;align-items:center;gap:8px;margin-bottom:16px}#title{flex:1;min-width:0;font-size:1em;font-weight:500}#back,#refresh{background:none;color:var(--tg-theme-accent-text-color);min-width:32px;padding:4px}#back{font-size:1.2em}#refresh{font-size:1.3em}#badge{font-size:.8em;color:var(--tg-theme-hint-color)}#badge.ok{color:var(--tg-theme-accent-text-color)}#badge.warn{color:var(--tg-theme-destructive-text-color)}#kicker,#note,#updated{font-size:.85em;color:var(--tg-theme-hint-color)}#kicker{margin-bottom:4px}h2{font-size:1.45em;font-weight:500;line-height:1.2;margin:0 0 8px}#body{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}#stats{display:flex;gap:16px;border-top:1px solid var(--tg-theme-section-separator-color);border-bottom:1px solid var(--tg-theme-section-separator-color);padding:12px 0;margin:16px 0}#stats .stat{flex:1;min-width:0;background:none;border-radius:0;text-align:left;padding:0}#stats small{display:block;font-size:.8em;color:var(--tg-theme-hint-color);margin-bottom:4px}#stats strong{color:var(--tg-theme-text-color);font-size:1.2em;font-weight:500;font-variant-numeric:tabular-nums}#stats .warn strong{color:var(--tg-theme-destructive-text-color)}#actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}#actions button{width:100%;min-height:44px;padding:12px;text-align:center;font-size:.95em}#actions button.primary{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}#actions button:disabled{background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-hint-color)}#actions button.danger{color:var(--tg-theme-destructive-text-color)}#ac
