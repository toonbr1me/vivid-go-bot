services:
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: db.env
        format: raw
    environment:
      PGHOST: db
    volumes:
      - ./backups:/backups
      - ../../scripts/backup.sh:/operations/backup.sh:ro
    command: [sh, /operations/backup.sh]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'test -f /backups/last-success && test "$$(($$(date +%s) - $$(cat /backups/last-success)))" -lt 25200']
      start_period: 30s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 2
  restore-db:
    image: postgres:17-alpine
    profiles: [restore-check]
    environment:
      POSTGRES_USER: restore_check
      POSTGRES_PASSWORD: restore_check_local_only
      POSTGRES_DB: vivid_restore_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, restore_check, -d, vivid_restore_test]
      interval: 2s
      retries: 20
  restore-check:
    image: postgres:17-alpine
    profiles: [restore-check]
    environment:
      PGHOST: restore-db
      PGUSER: restore_check
      PGPASSWORD: restore_check_local_only
      PGDATABASE: vivid_restore_test
    volumes:
      - ./backups:/backups:ro
      - ../../scripts/restore-check.sh:/operations/restore-check.sh:ro
    command: [sh, /operations/restore-check.sh]
    depends_on:
      restore-db:
        condition: service_healthy
