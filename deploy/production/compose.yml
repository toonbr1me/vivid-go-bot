name: vivid-go-production
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: db.env
        format: raw
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U vivid_prod -d vivid_prod]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      options: {max-size: 10m, max-file: '3'}
  app:
    image: vivid-go-bot:production-20261116-support-fix
    restart: unless-stopped
    env_file:
      - path: app.env
        format: raw
    ports: [127.0.0.1:38080:8080]
    volumes: [./themes/berloga:/app/web:ro]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 5s
      retries: 4
    logging:
      options: {max-size: 10m, max-file: '3'}

volumes:
  db_data:
